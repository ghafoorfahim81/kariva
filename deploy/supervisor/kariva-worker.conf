; Background jobs: photo scanning, nightly clean-up. If this is not running, new photos stay "pending".
[program:kariva-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kariva/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/kariva/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/kariva/worker.log
