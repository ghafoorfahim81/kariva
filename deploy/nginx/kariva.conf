# Kariva: one server, one domain. Replace kariva.example everywhere.
# The browser app is static files; /api and /sanctum go to PHP. Same origin, so no CORS and the cookie session just works.

limit_req_zone $binary_remote_addr zone=kariva_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kariva_api:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kariva.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kariva.example;

    ssl_certificate     /etc/letsencrypt/live/kariva.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kariva.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/kariva/web;           # the built browser app (npm run build -> dist)
    index index.html;

    # Uploads: photos only, a few MB. Larger bodies are refused before PHP sees them.
    client_max_body_size 8m;

    # Page-level protection for the browser app.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Built assets carry a hash in their name: cache for ever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API.
    location ^~ /api/ {
        limit_req zone=kariva_api burst=60 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/kariva/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Login codes: tighter than the API as a whole (the app also rate-limits per phone and per IP).
    location = /api/v1/auth/otp {
        limit_req zone=kariva_auth burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/kariva/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /sanctum/csrf-cookie {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/kariva/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Public uploads (avatars, service photos) when files live on this server's disk.
    # Identity documents are NOT here: they are on the private disk and only an admin can stream them through the API.
    location /storage/ {
        alias /var/www/kariva/backend/storage/app/public/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        try_files $uri =404;
    }

    # The browser app: any other path gets index.html (client-side routing).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Never serve hidden files or the framework.
    location ~ /\.(?!well-known) { deny all; }
}
