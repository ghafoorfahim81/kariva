name: frontend

on:
  push:
    paths: ['kariva-v4.8/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['kariva-v4.8/**', '.github/workflows/frontend.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kariva-v4.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kariva-v4.8/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npx vite build
